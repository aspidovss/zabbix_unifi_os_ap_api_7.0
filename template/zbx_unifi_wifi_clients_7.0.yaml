        - uuid: dd63ca6dc6d64b629da603f44e4cc431
          name: Anomalies JSON
          type: HTTP_AGENT
          key: client.anomalies.json
          delay: '{$ITEM_CLIENT.ANOMALY_UPDATE}'
          history: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function anomalyIgnore(s) {
                      var m = {}, a = String(s || '').split(/[\s,;]+/);
                      for (var i = 0; i < a.length; i++) {
                          if (a[i] && a[i].charAt(0) !== '{') m[a[i].toUpperCase()] = true;
                      }
                      return m;
                  }
                  function anomalyShort(t) {
                      return String(t).replace(/^(USER_|AP_)/, '');
                  }
                  // entries: [{anomaly, timestamps}] of one device; returns summary
                  function anomalySummary(entries, now, activeMin, ignore, onlyType) {
                      var step = 300000, win = activeMin * 60000;
                      var active = {}, streak = 0, streakType = 'none', hour = {}, n24 = 0;
                      for (var i = 0; i < entries.length; i++) {
                          var e = entries[i];
                          if (ignore[e.anomaly] || ignore[anomalyShort(e.anomaly)]) continue;
                          if (onlyType && e.anomaly !== onlyType) continue;
                          var ts = (e.timestamps || []).slice().sort(function (a, b) { return a - b; });
                          if (!ts.length) continue;
                          n24 += ts.length;
                          for (var k = 0; k < ts.length; k++) {
                              if (now - ts[k] <= 3600000) hour[ts[k]] = true;
                          }
                          var last = ts[ts.length - 1];
                          if (now - last <= win) {
                              active[anomalyShort(e.anomaly)] = true;
                              var c = 1;
                              for (var k = ts.length - 1; k > 0 && ts[k] - ts[k - 1] <= step; k--) c++;
                              if (c * 5 > streak) {
                                  streak = c * 5;
                                  streakType = anomalyShort(e.anomaly);
                              }
                          }
                      }
                      var names = [];
                      for (var n in active) names.push(n);
                      names.sort();
                      var h = 0;
                      for (var t in hour) h++;
                      return {active: names.length ? names.join(', ') : 'none', streak_min: streak, streak_type: streakType,
                              minutes_1h: h * 5, intervals_24h: n24};
                  }
                  var j = JSON.parse(value);
                  var mac = '{$CLIENT.MAC}'.toLowerCase();
                  var data = j.data || [], mine = [];
                  for (var i = 0; i < data.length; i++) {
                      if (String(data[i].mac).toLowerCase() === mac) mine.push(data[i]);
                  }
                  return JSON.stringify(anomalySummary(mine, Date.now(), parseInt('{$ANOMALY_ACTIVE_MIN}', 10) || 15, anomalyIgnore('{$ANOMALY_IGNORE}')));
          url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/api/s/{$SITE.REF}/stat/anomalies
          headers:
            - name: Accept
              value: application/json
            - name: X-API-KEY
              value: '{$UNIFI_NETWORK_API_KEY}'
          description: UniFi anomalies of the site for the last 24h; preprocessing keeps only this client.
          tags:
            - tag: UniFi Component
              value: Raw
          timeout: '{$ITEM_CLIENT.TIMEOUT}'
        - uuid: 26c569a1c1fc420d8c8b2673376efc10
          name: 'Anomalies: Active'
          type: DEPENDENT
          key: client.anomaly.active
          delay: '0'
          history: '{$ITEM_CLIENT.ANOMALY.TEXT_HISTORY}'
