            - tag: UniFi Component
              value: Anomalies
          trends: 30d
        - uuid: d6b292969dc44503b30fe8d2ef1f1e0f
          name: ICMP Ping
          type: SIMPLE
          key: icmpping
          delay: '{$ITEM_CLIENT.PING_UPDATE}'
          history: '{$ITEM_CLIENT_HISTORY}'
          trends: 30d
          description: 1 = responds, 0 = no response. Checked against the client IP from UniFi.
          tags:
            - tag: UniFi Component
              value: Ping
          triggers:
            - uuid: 8f780014ebb247ecb87114343bcadd4d
              expression: '{$TRIGGER_CLIENT_PING}=1 and max(/UniFi Network API - Wi-Fi Client/icmpping,{$TRIGGER_CLIENT_PING_TIME})=0 and last(/UniFi Network API - Wi-Fi Client/client.connected)=1'
              name: Client is connected in UniFi but does not respond to ping for {$TRIGGER_CLIENT_PING_TIME}
              priority: AVERAGE
              description: 'Radio link is up (client associated to AP) but the device itself is not reachable: device hung, IP/VLAN problem or routing. Needs a route from the Zabbix server/proxy to the client and fping. Set {$TRIGGER_CLIENT_PING} to 0 if the clients are not reachable from Zabbix.'
        - uuid: d221d962925b4b77886e5c898a4fd0c7
          name: ICMP Loss
          type: SIMPLE
          key: icmppingloss
          delay: '{$ITEM_CLIENT.PING_UPDATE}'
          history: '{$ITEM_CLIENT_HISTORY}'
          trends: 30d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: UniFi Component
              value: Ping
        - uuid: a95c51e08aa94d60a747749ab05f4d8f
          name: ICMP Response Time
          type: SIMPLE
          key: icmppingsec
          delay: '{$ITEM_CLIENT.PING_UPDATE}'
          history: '{$ITEM_CLIENT_HISTORY}'
          trends: 30d
          value_type: FLOAT
          units: s
          tags:
            - tag: UniFi Component
              value: Ping
        - uuid: 50cb537b95c44537861a8642438f619d
          name: Hostname
          type: DEPENDENT
          key: client.hostname
          delay: '0'
          history: '{$ITEM_CLIENT.INFO_HISTORY}'
          value_type: CHAR
          description: Hostname reported by the client (DHCP)
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.hostname
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: client.json
          tags:
            - tag: UniFi Component
              value: Connection
        - uuid: dbc88b11115748289db4a83574775bb4
          name: Manufacturer (OUI)
          type: DEPENDENT
          key: client.oui
          delay: '0'
          history: '{$ITEM_CLIENT.INFO_HISTORY}'
          value_type: CHAR
          description: Vendor of the MAC address as reported by UniFi
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.oui
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: client.json
          tags:
            - tag: UniFi Component
              value: Connection
        - uuid: 3db0806447f2495c9cc73ee19b5d70ac
          name: Connection Type
          type: DEPENDENT
          key: client.conn_type
          delay: '0'
          history: '{$ITEM_CLIENT.INFO_HISTORY}'
          value_type: CHAR
          description: Wired or Wireless
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.conn_type
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: client.json
          tags:
            - tag: UniFi Component
              value: Connection
      macros:
        - macro: '{$ANOMALY_ACTIVE_MIN}'
          value: '15'
          description: Anomaly is active if seen within this many minutes
        - macro: '{$ANOMALY_IGNORE}'
          value: ''
          description: Anomaly types to ignore, comma separated (e.g. USER_DNS_TIMEOUT)
        - macro: '{$CLIENT.MAC}'
          description: Client MAC. Filled by discovery, DO NOT CHANGE OR DELETE.
        - macro: '{$ITEM_CLIENT.ANOMALY.TEXT_HISTORY}'
          value: 7d
          description: Anomaly text History
        - macro: '{$ITEM_CLIENT.ANOMALY_UPDATE}'
          value: 5m
          description: Item 'client.anomalies.json' Update Interval (UniFi uses 5-minute intervals)
        - macro: '{$ITEM_CLIENT.BYTES_HISTORY}'
          value: 7d
          description: Total traffic History
        - macro: '{$ITEM_CLIENT.INFO_HISTORY}'
          value: 30d
          description: Client text items History
        - macro: '{$ITEM_CLIENT.JSON_UPDATE}'
          value: 2m
          description: Item 'client.json' Update Interval
        - macro: '{$ITEM_CLIENT.PING_UPDATE}'
          value: 1m
          description: ICMP ping interval
        - macro: '{$ITEM_CLIENT.RAW_HISTORY}'
          value: 1d
          description: Raw counter rates History
        - macro: '{$ITEM_CLIENT.ROAM_HISTORY}'
          value: 30d
          description: Roaming history (Access Point changes)
        - macro: '{$ITEM_CLIENT.TIMEOUT}'
          value: 15s
          description: Timeout of the client data and anomalies requests (each reads the list of its site)
        - macro: '{$ITEM_CLIENT_HISTORY}'
          value: 30d
          description: Client numeric items History
        - macro: '{$SITE.REF}'
          description: Site short name. Filled by discovery, DO NOT CHANGE OR DELETE.
        - macro: '{$TRIGGER_CLIENT_ANOMALY_TIME}'
          value: '30'
          description: Anomaly alert after this many minutes without interruption
        - macro: '{$TRIGGER_CLIENT_CCQ_MIN}'
          value: '50'
          description: Low CCQ threshold, %
        - macro: '{$TRIGGER_CLIENT_CCQ_TIME}'
          value: 30m
          description: CCQ must stay below threshold this long
        - macro: '{$TRIGGER_CLIENT_EXPERIENCE_MIN}'
          value: '70'
          description: Low Experience threshold, % (average)
        - macro: '{$TRIGGER_CLIENT_EXPERIENCE_TIME}'
          value: 7d
          description: Experience averaging period
        - macro: '{$TRIGGER_CLIENT_OFFLINE_TIME}'
          value: 48h
          description: Offline alert after the client is not connected this long
        - macro: '{$TRIGGER_CLIENT_PING_TIME}'
          value: 5m
          description: 'Connected but no ping: alert after this period'
        - macro: '{$TRIGGER_CLIENT_PING}'
          value: '1'
          description: 1 = alert when the client is connected in UniFi but does not answer ping; 0 = off
        - macro: '{$TRIGGER_CLIENT_RATE_HIGH}'
          value: '0'
          description: 'Rate above this (Mbps) for {$TRIGGER_CLIENT_RATE_TIME}: Info event. 0 = off'
        - macro: '{$TRIGGER_CLIENT_RATE_LOW}'
          value: '0'
          description: 'Rate below this (Mbps) for {$TRIGGER_CLIENT_RATE_TIME}: Warning. 0 = off'
        - macro: '{$TRIGGER_CLIENT_RATE_TIME}'
          value: 10m
          description: Tx/Rx Rate must stay above/below threshold this long
        - macro: '{$TRIGGER_CLIENT_ROAM_SHOW}'
          value: 1m
          description: Roaming event closes automatically after this time
        - macro: '{$TRIGGER_CLIENT_SIGNAL_CRIT}'
          value: '-80'
          description: Very weak signal threshold, dBm
        - macro: '{$TRIGGER_CLIENT_SIGNAL_MIN}'
          value: '-75'
          description: Weak signal threshold, dBm
        - macro: '{$TRIGGER_CLIENT_SIGNAL_TIME}'
          value: 10m
          description: Signal must stay below threshold this long
        - macro: '{$TRIGGER_CLIENT_TXDROPPED_TIME}'
          value: 30m
          description: Dropped frames must stay above threshold this long
        - macro: '{$TRIGGER_CLIENT_TXDROPPED}'
          value: '5'
          description: Dropped frames threshold, %
        - macro: '{$TRIGGER_CLIENT_TXRETRIES_MIN_PPS}'
          value: '5'
          description: Tx Retries, Low CCQ and Dropped frames triggers fire only if the AP sends more than this many packets/s to the client
        - macro: '{$TRIGGER_CLIENT_TXRETRIES_TIME}'
          value: 30m
          description: Tx Retries must stay above threshold this long
        - macro: '{$TRIGGER_CLIENT_TXRETRIES}'
          value: '30'
          description: Tx Retries threshold, %
