          name: Clients Avg Connection Time
          type: DEPENDENT
          key: ap.clients.avg_duration
          delay: '0'
          history: '{$ITEM_AP.CLIENTS_HISTORY}'
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.clients
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value);
                  var now = Date.now(), sum = 0, n = 0;
                  for (var i = 0; i < a.length; i++) {
                      var t = Date.parse(a[i].connectedAt);
                      if (!isNaN(t)) {
                          sum += (now - t) / 1000;
                          n++;
                      }
                  }
                  return n ? Math.round(sum / n) : 0;
          master_item:
            key: clients.json
          tags:
