zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  host_groups:
    - uuid: 4c0f56220ce54f649a2a4df37d4ca0c1
      name: UniFi Network/Sites
    - uuid: 0773082d66f540b8ae6dce4cb0aa023d
      name: UniFi Network/Access Points
  templates:
    - uuid: 8d4ea8f16d5044cf97058459be7b5f6a
      template: UniFi Network API
      name: UniFi Network API
      description: |
        UniFi Network monitoring for Zabbix 7.0: sites and access points.
        Release 1.0.0. Project: Zabbix_unifi_os_ap_api_7.0 (author AspidovSS, MIT License).
        Based on https://github.com/MassimilianoPasquini97/zbx_unifi_network_api

        This host discovers Site hosts (Discovery Sites) and Access Point hosts (Discovery Access Points, all sites).
        Zabbix 7.0 does not run host prototypes on discovered hosts, so AP discovery lives on this host.
        Only devices with feature 'accessPoint' are discovered.

        REQUIRED GLOBAL MACROS (Administration -> Macros):
        - {$UNIFI_NETWORK_API_ADDRESS}: Text. IP or DNS of the UniFi OS console, with :port if not 443.
        - {$UNIFI_NETWORK_API_KEY}: Vault secret (e.g. secret/zabbix/unifi:api-key) or Secret text.
        Do NOT define these two macros on templates or hosts.
      groups:
        - name: Templates/Network devices
      items:
        - uuid: c3ebff2207424f42a4e081fabe368957
          name: Application Version
          type: HTTP_AGENT
          key: application.version
          delay: '{$ITEM_APPLICATION.VERSION_UPDATE}'
          history: '{$ITEM_APPLICATION.VERSION_HISTORY}'
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.applicationVersion
          url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/integration/v1/info
          headers:
            - name: Accept
              value: application/json
            - name: X-API-KEY
              value: '{$UNIFI_NETWORK_API_KEY}'
          triggers:
            - uuid: bf3b92521aef441990f97279bfe69b24
              expression: change(/UniFi Network API/application.version)=1
              name: Application Version Changed
              priority: INFO
            - uuid: 96cbe8689a6d4c22b65df5e971d09506
              expression: nodata(/UniFi Network API/application.version,{$TRIGGER_NODATA})=1
              name: No Data for {$TRIGGER_NODATA}
              priority: HIGH
          tags:
            - tag: UniFi Component
              value: System
        - uuid: d6bb0983f9fe45348b4cd8e2785bd941
          name: Sites JSON
          type: HTTP_AGENT
          key: sites.json
          delay: '{$ITEM_SITES.JSON_UPDATE}'
          history: '0'
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
          url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/integration/v1/sites
          query_fields:
            - name: limit
              value: '200'
          headers:
            - name: Accept
              value: application/json
            - name: X-API-KEY
              value: '{$UNIFI_NETWORK_API_KEY}'
          tags:
            - tag: UniFi Component
              value: Raw
        - uuid: eaab8cbe2c434b1db68ca19ce7ad9f0f
          name: Access Points JSON (all sites)
          type: SCRIPT
          key: aps.json
          delay: '{$ITEM_APS.JSON_UPDATE}'
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var base = 'https://' + p.address + '/proxy/network/integration/v1';

            var req = new HttpRequest();
            req.addHeader('Accept: application/json');
            req.addHeader('X-API-KEY: ' + p.api_key);

            function getAll(path) {
                var out = [], offset = 0, total = 0, pages = 0, j;
                do {
                    var resp = req.get(base + path + '?limit=200&offset=' + offset);
                    if (req.getStatus() != 200) {
                        throw 'UniFi API HTTP ' + req.getStatus() + ' on ' + path + ': ' + String(resp).substring(0, 200);
                    }
                    j = JSON.parse(resp);
                    total = j.totalCount;
                    out = out.concat(j.data);
                    offset += j.data.length;
                    pages++;
                } while (j.data.length > 0 && offset < total && pages < 50);
                return out;
            }

            var sites = getAll('/sites');
            var aps = [], failed = 0, failedNames = [];

            for (var s = 0; s < sites.length; s++) {
                var devs;
                try {
                    devs = getAll('/sites/' + sites[s].id + '/devices');
                } catch (e) {
                    failed++;
                    failedNames.push(sites[s].name);
                    Zabbix.log(3, '[UniFi AP discovery] site "' + sites[s].name + '": ' + e);
                    continue;
                }
                for (var i = 0; i < devs.length; i++) {
                    var f = devs[i].features || [];
                    if (f.indexOf('accessPoint') === -1) continue;
                    aps.push({
                        id: devs[i].id,
                        name: devs[i].name || devs[i].macAddress,
                        model: devs[i].model,
                        mac: devs[i].macAddress,
                        state: devs[i].state,
                        site_id: sites[s].id,
                        site_name: sites[s].name,
                        site_ref: sites[s].internalReference
                    });
                }
            }

            if (failed > 0) {
                // never return a partial list: discovery would treat APs of failed sites as deleted
                throw 'UniFi API: devices request failed for ' + failed + ' of ' + sites.length + ' sites: ' + failedNames.join(', ');
            }

            return JSON.stringify(aps);
          timeout: 300s
          parameters:
            - name: address
              value: '{$UNIFI_NETWORK_API_ADDRESS}'
            - name: api_key
              value: '{$UNIFI_NETWORK_API_KEY}'
          description: All devices with feature accessPoint from all sites, paginated. Source for Discovery Access Points.
          tags:
            - tag: UniFi Component
              value: Raw
        - uuid: 710d563918d04a66b583991e37ed674a
          name: Access Points Total (all sites)
          type: DEPENDENT
          key: aps.total
          delay: '0'
          history: '{$ITEM_APS_HISTORY}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  return JSON.parse(value).length;
          master_item:
            key: aps.json
          tags:
            - tag: UniFi Component
              value: Access Points
        - uuid: 4736de0619fc478785fedbffddae1164
          name: Access Points Offline (all sites)
          type: DEPENDENT
          key: aps.offline
          delay: '0'
          history: '{$ITEM_APS_HISTORY}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value), n = 0;
                  for (var i = 0; i < a.length; i++) {
                      if (a[i].state !== 'ONLINE') n++;
                  }
                  return n;
          master_item:
            key: aps.json
          tags:
            - tag: UniFi Component
              value: Access Points
      discovery_rules:
        - uuid: 547add54b79142c29ed100b9b17182a9
          name: Discovery Sites
          type: DEPENDENT
          key: discovery.sites
          delay: '0'
          host_prototypes:
            - uuid: 1a55e15794694c3dbf70993f49731617
              host: '{#ID}'
              name: UniFi [{#NAME}] - Site
              group_links:
                - group:
                    name: UniFi Network/Sites
              templates:
                - name: UniFi Network API - Site
              macros:
                - macro: '{$SITE.ID}'
                  value: '{#ID}'
                  description: Site ID. Used by Template, DO NOT CHANGE OR DELETE.
                - macro: '{$SITE.NAME}'
                  value: '{#NAME}'
                  description: Site NAME. Used by Template, DO NOT CHANGE OR DELETE.
              tags:
                - tag: UniFi Type
                  value: Site
          master_item:
            key: sites.json
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
        - uuid: 480ac1b10c3c449a9ab27235159fb386
          name: Discovery Access Points
          type: DEPENDENT
          key: discovery.aps
          delay: '0'
          host_prototypes:
            - uuid: 9a78941ed43e42cdbffb076098b202a3
              host: '{#ID}'
              name: UniFi [{#SITE.NAME}] - AP:{#NAME}
              group_links:
                - group:
                    name: UniFi Network/Access Points
              templates:
                - name: UniFi Network API - Device
              macros:
                - macro: '{$SITE.ID}'
                  value: '{#SITE.ID}'
                  description: Site ID. Used by Template, DO NOT CHANGE OR DELETE.
                - macro: '{$SITE.NAME}'
                  value: '{#SITE.NAME}'
                  description: Site NAME. Used by Template, DO NOT CHANGE OR DELETE.
                - macro: '{$AP.MAC}'
                  value: '{#MAC}'
                  description: AP MAC. Used by Template, DO NOT CHANGE OR DELETE.
                - macro: '{$SITE.REF}'
                  value: '{#SITE.REF}'
                  description: Site short name (internalReference). Used by Template, DO NOT CHANGE OR DELETE.
              tags:
                - tag: UniFi Site
                  value: '{#SITE.NAME}'
                - tag: UniFi Type
                  value: Access Point
                - tag: UniFi Model
                  value: '{#MODEL}'
          master_item:
            key: aps.json
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#MODEL}'
              path: $.model
            - lld_macro: '{#SITE.ID}'
              path: $.site_id
            - lld_macro: '{#SITE.NAME}'
              path: $.site_name
            - lld_macro: '{#MAC}'
              path: $.mac
            - lld_macro: '{#SITE.REF}'
              path: $.site_ref
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value), out = [];
                  for (var i = 0; i < a.length; i++) {
                      out.push({id: a[i].id, name: a[i].name, model: a[i].model, mac: a[i].mac,
                                site_id: a[i].site_id, site_name: a[i].site_name, site_ref: a[i].site_ref});
                  }
                  out.sort(function (x, y) { return x.id < y.id ? -1 : (x.id > y.id ? 1 : 0); });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '{$LLD_APS_HEARTBEAT}'
      macros:
        - macro: '{$ITEM_APPLICATION.VERSION_HISTORY}'
          value: 7d
          description: Item 'application.version' History
        - macro: '{$ITEM_APPLICATION.VERSION_UPDATE}'
          value: 10m
          description: Item 'application.version' Update Interval
        - macro: '{$ITEM_APS.JSON_UPDATE}'
          value: 30m
          description: Item 'aps.json' Update Interval (AP counters; discovery itself runs on change or once a day)
        - macro: '{$ITEM_APS_HISTORY}'
          value: 7d
          description: Items 'aps.*' History
        - macro: '{$ITEM_SITES.JSON_UPDATE}'
          value: 1d
          description: Item 'sites.json' Update Interval
        - macro: '{$LLD_APS_HEARTBEAT}'
          value: 1d
          description: AP discovery runs when the AP list changes (added/removed/renamed) or at least once per this period
        - macro: '{$TRIGGER_NODATA}'
          value: 30m
          description: Trigger 'No Data' after 30 minutes of missing data
    - uuid: 9effe2d07c5d49e18a608372b170d506
