        - uuid: 9f0896899dcb480e97e756c45d2692a8
          name: AP Wireless Clients and Anomalies JSON
          type: SCRIPT
          key: clients.json
          delay: '{$ITEM_CLIENTS.JSON_UPDATE}'
          history: '0'
          value_type: TEXT
          params: |
            function anomalyIgnore(s) {
                var m = {}, a = String(s || '').split(/[\s,;]+/);
                for (var i = 0; i < a.length; i++) {
                    if (a[i] && a[i].charAt(0) !== '{') m[a[i].toUpperCase()] = true;
                }
                return m;
            }
            function anomalyShort(t) {
                return String(t).replace(/^(USER_|AP_)/, '');
            }
            // entries: [{anomaly, timestamps}] of one device; returns summary
            function anomalySummary(entries, now, activeMin, ignore, onlyType) {
                var step = 300000, win = activeMin * 60000;
                var active = {}, streak = 0, streakType = 'none', hour = {}, n24 = 0;
                for (var i = 0; i < entries.length; i++) {
                    var e = entries[i];
                    if (ignore[e.anomaly] || ignore[anomalyShort(e.anomaly)]) continue;
                    if (onlyType && e.anomaly !== onlyType) continue;
                    var ts = (e.timestamps || []).slice().sort(function (a, b) { return a - b; });
                    if (!ts.length) continue;
                    n24 += ts.length;
                    for (var k = 0; k < ts.length; k++) {
                        if (now - ts[k] <= 3600000) hour[ts[k]] = true;
                    }
                    var last = ts[ts.length - 1];
                    if (now - last <= win) {
                        active[anomalyShort(e.anomaly)] = true;
                        var c = 1;
                        for (var k = ts.length - 1; k > 0 && ts[k] - ts[k - 1] <= step; k--) c++;
                        if (c * 5 > streak) {
                            streak = c * 5;
                            streakType = anomalyShort(e.anomaly);
                        }
                    }
                }
                var names = [];
                for (var n in active) names.push(n);
                names.sort();
                var h = 0;
                for (var t in hour) h++;
                return {active: names.length ? names.join(', ') : 'none', streak_min: streak, streak_type: streakType,
                        minutes_1h: h * 5, intervals_24h: n24};
            }
            var p = JSON.parse(value);
            var base = 'https://' + p.address + '/proxy/network';
            var req = new HttpRequest();
            req.addHeader('Accept: application/json');
            req.addHeader('X-API-KEY: ' + p.api_key);

            function get(url) {
                var resp = req.get(url);
                if (req.getStatus() != 200) {
                    throw 'UniFi API HTTP ' + req.getStatus() + ': ' + String(resp).substring(0, 200);
                }
                return JSON.parse(resp);
            }

            // 1. wireless clients of this AP (official API, paginated)
            var clients = [], offset = 0, total = 0, pages = 0, j;
            do {
                j = get(base + '/integration/v1/sites/' + p.site_id + '/clients?limit=200&offset=' + offset);
                total = j.totalCount;
                for (var i = 0; i < j.data.length; i++) {
                    var c = j.data[i];
                    if (c.type !== 'WIRELESS' || c.uplinkDeviceId !== p.device_id) continue;
                    clients.push({id: c.id, name: c.name, ip: c.ipAddress, mac: c.macAddress, connectedAt: c.connectedAt,
                                  uplinkDeviceId: c.uplinkDeviceId, access: c.access ? c.access.type : null});
                }
                offset += j.data.length;
                pages++;
            } while (j.data.length > 0 && offset < total && pages < 50);

            // 2. anomalies (internal API); a failure here must not break client counters
            var anomalies = null;
            try {
                var now = Date.now();
                var activeMin = parseInt(p.active_min, 10) || 15;
                var ignore = anomalyIgnore(p.ignore);
                var dev = (get(base + '/api/s/' + p.site_ref + '/stat/device/' + p.ap_mac).data || [])[0] || {};
                var apMacs = {};
                apMacs[String(p.ap_mac).toLowerCase()] = true;
                if (dev.mac) apMacs[String(dev.mac).toLowerCase()] = true;
                var lists = [dev.ethernet_table || [], dev.vap_table || []];
                for (var l = 0; l < lists.length; l++) {
                    for (var i = 0; i < lists[l].length; i++) {
                        var m = lists[l][i].mac || lists[l][i].bssid;
                        if (lists[l][i].bssid) apMacs[String(lists[l][i].bssid).toLowerCase()] = true;
                        if (m) apMacs[String(m).toLowerCase()] = true;
                    }
                }
                var an = get(base + '/api/s/' + p.site_ref + '/stat/anomalies').data || [];
                var apEntries = [], byClient = {};
                for (var i = 0; i < an.length; i++) {
                    var mac = String(an[i].mac).toLowerCase();
                    if (/^AP_/.test(an[i].anomaly)) {
                        if (apMacs[mac]) apEntries.push(an[i]);
                    } else {
                        (byClient[mac] = byClient[mac] || []).push(an[i]);
                    }
                }
                var apSum = anomalySummary(apEntries, now, activeMin, ignore);
                var drop = anomalySummary(apEntries, now, activeMin, ignore, 'AP_HIGH_DROP_RATE');
                var assoc = anomalySummary(apEntries, now, activeMin, ignore, 'AP_LONG_MAX_ASSOCIATION_TIME');
                var withAn = [];
                for (var i = 0; i < clients.length; i++) {
                    var s = anomalySummary(byClient[String(clients[i].mac).toLowerCase()] || [], now, activeMin, ignore);
                    if (s.active !== 'none') withAn.push(clients[i].name + ' | ' + s.active);
                }
                withAn.sort();
                anomalies = {
                    ap_active: apSum.active,
                    ap_drop_streak_min: drop.streak_min,
                    ap_long_assoc_1h: assoc.minutes_1h / 5,
                    clients_count: withAn.length,
                    clients_pct: clients.length ? Math.round(1000 * withAn.length / clients.length) / 10 : 0,
                    clients_list: withAn.length ? withAn.join('\n') : 'none'
                };
            } catch (e) {
                Zabbix.log(3, '[UniFi AP anomalies] ' + e);
            }

            return JSON.stringify({clients: clients, anomalies: anomalies});
          timeout: 60s
          parameters:
            - name: address
              value: '{$UNIFI_NETWORK_API_ADDRESS}'
            - name: api_key
              value: '{$UNIFI_NETWORK_API_KEY}'
            - name: site_id
              value: '{$SITE.ID}'
            - name: site_ref
              value: '{$SITE.REF}'
            - name: device_id
              value: '{HOST.HOST}'
            - name: ap_mac
              value: '{$AP.MAC}'
            - name: ignore
              value: '{$ANOMALY_IGNORE}'
            - name: active_min
              value: '{$ANOMALY_ACTIVE_MIN}'
          description: Wireless clients of this AP (official API) + UniFi anomalies of the AP and of its clients (internal API stat/anomalies).
          tags:
            - tag: UniFi Component
              value: Raw
