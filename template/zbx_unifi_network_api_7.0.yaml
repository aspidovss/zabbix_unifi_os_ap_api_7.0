                  var a = JSON.parse(value);
                  a.sort(function (x, y) {
                      return String(x.name).toLowerCase() < String(y.name).toLowerCase() ? -1 : 1;
                  });
                  var lines = [];
                  for (var i = 0; i < a.length; i++) {
                      lines.push(a[i].name + ' | ' + a[i].ip + ' | ' + a[i].mac);
                  }
                  return lines.length ? lines.join('\n') : 'no clients';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: clients.json
          tags:
