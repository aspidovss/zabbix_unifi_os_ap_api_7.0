              value: Clients
        - uuid: 4c8ca32b71d74cbf8ab723f3fd8148cb
          name: Device Stat JSON (radio and uplink details)
          type: HTTP_AGENT
          key: stat.json
          delay: '{$ITEM_STAT.JSON_UPDATE}'
          history: '0'
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var j = JSON.parse(value);
                  if (!j.data || !j.data.length) {
                      throw 'UniFi device API: no data (' + (j.meta ? j.meta.msg : 'unknown') + ')';
                  }
                  var d = j.data[0];
                  var st = (d.stat && d.stat.ap) ? d.stat.ap : {};
                  var bands = {ng: '2.4GHz', na: '5GHz', '6e': '6GHz'};

                  function num(k) {
                      var v = st[k];
                      return (v === undefined || v === null) ? 0 : Number(v);
                  }

                  var cfg = {};
                  var rt = d.radio_table || [];
                  for (var i = 0; i < rt.length; i++) {
                      cfg[rt[i].name] = rt[i];
                  }

                  var radios = [];
                  var rs = d.radio_table_stats || [];
                  for (var i = 0; i < rs.length; i++) {
                      var s = rs[i], c = cfg[s.name] || {}, r = s.radio, w = s.name;
                      var gain = (s.gain !== undefined && s.gain !== null) ? s.gain : (c.antenna_gain || 0);
                      radios.push({
                          radio: r,
                          band: bands[r] || r,
                          state: s.state,
                          channel: s.channel,
                          bw: s.bw,
                          tx_power: s.tx_power,
                          antenna_gain: (c.antenna_gain !== undefined) ? c.antenna_gain : gain,
                          eirp: s.tx_power + gain,
                          cu_total: s.cu_total,
                          cu_self_rx: s.cu_self_rx,
                          cu_self_tx: s.cu_self_tx,
                          satisfaction: s.satisfaction,
                          num_sta: s.num_sta,
                          guest_num_sta: s['guest-num_sta'] || 0,
                          tx_retries_pct: s.tx_retries_pct,
                          tx_packets: num(r + '-tx_packets'),
                          tx_bytes: num(r + '-tx_bytes'),
                          rx_packets: num(r + '-rx_packets'),
                          rx_bytes: num(r + '-rx_bytes'),
                          tx_attempts: num(r + '-wifi_tx_attempts'),
                          tx_dropped: num(r + '-wifi_tx_dropped'),
                          rx_dropped: num(w + '-rx_dropped')
                      });
                  }

                  var lu = d.last_uplink || {}, up = d.uplink || {};
                  var lldp = (d.lldp_table && d.lldp_table.length) ? d.lldp_table[0] : {};
                  var parentMac = lu.uplink_mac || up.uplink_mac || lldp.chassis_id || '';
                  var uplink = {
                      parent: lu.uplink_device_name || up.uplink_device_name || lldp.chassis_name || lldp.system_name || parentMac || 'unknown',
                      parent_mac: parentMac || 'unknown',
                      parent_info: lldp.chassis_descr ? String(lldp.chassis_descr).split('\n')[0] : 'n/a',
                      port: lu.uplink_remote_port || up.uplink_remote_port || lldp.port_id || 'n/a',
                      type: up.type || lu.type || 'unknown',
                      speed: up.speed || 0,
                      rx_packets: up.rx_packets || 0,
                      rx_bytes: up.rx_bytes || 0,
                      tx_packets: up.tx_packets || 0,
                      tx_bytes: up.tx_bytes || 0
                  };

                  return JSON.stringify({
                      uplink: uplink,
                      satisfaction: d.satisfaction,
                      num_sta: d.num_sta,
                      guest_num_sta: d['guest-num_sta'] || 0,
                      radios: radios
                  });
          url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/api/s/{$SITE.REF}/stat/device/{$AP.MAC}
          headers:
            - name: Accept
              value: application/json
            - name: X-API-KEY
              value: '{$UNIFI_NETWORK_API_KEY}'
          description: Internal UniFi Network API stat/device. Preprocessing keeps only radio metrics (device keys are dropped).
          tags:
            - tag: UniFi Component
              value: Raw
