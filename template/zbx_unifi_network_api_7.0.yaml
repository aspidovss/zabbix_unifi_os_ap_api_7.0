    - uuid: d42f2e59a92b4d22a52b99ee35f7ce5f
      template: UniFi Network API - Site
      name: UniFi Network API - Site
      groups:
        - name: Templates/Network devices
      items:
        - uuid: bc7f018c55de40f6b0bdf2aa66f6d333
          name: Wireless Clients JSON
          type: SCRIPT
          key: clients.json
          delay: '{$ITEM_CLIENTS.JSON_UPDATE}'
          history: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var base = 'https://' + p.address + '/proxy/network/integration/v1/sites/' + p.site_id + '/clients';
            var limit = 200, offset = 0, total = 0, pages = 0, out = [], j;

            var req = new HttpRequest();
            req.addHeader('Accept: application/json');
            req.addHeader('X-API-KEY: ' + p.api_key);

            do {
                var resp = req.get(base + '?limit=' + limit + '&offset=' + offset);
                if (req.getStatus() != 200) {
                    throw 'UniFi API HTTP ' + req.getStatus() + ': ' + String(resp).substring(0, 200);
                }
                j = JSON.parse(resp);
                total = j.totalCount;
                for (var i = 0; i < j.data.length; i++) {
                    var c = j.data[i];
                    if (c.type !== 'WIRELESS') continue;
                    if (p.device_id && c.uplinkDeviceId !== p.device_id) continue;
                    out.push({
                        id: c.id,
                        name: c.name,
                        ip: c.ipAddress,
                        mac: c.macAddress,
                        connectedAt: c.connectedAt,
                        uplinkDeviceId: c.uplinkDeviceId,
                        access: c.access ? c.access.type : null
                    });
                }
                offset += j.data.length;
                pages++;
            } while (j.data.length > 0 && offset < total && pages < 50);

            return JSON.stringify(out);
          timeout: 60s
          parameters:
            - name: address
              value: '{$UNIFI_NETWORK_API_ADDRESS}'
            - name: api_key
              value: '{$UNIFI_NETWORK_API_KEY}'
            - name: site_id
              value: '{$SITE.ID}'
          description: All WIRELESS clients of the site, paginated (200 per request).
          tags:
            - tag: UniFi Component
              value: Raw
        - uuid: bde0f31d0901467fbc7a301fc6eb58d9
          name: Clients Wireless
          type: DEPENDENT
          key: clients.wireless
          delay: '0'
          history: '{$ITEM_CLIENTS.WIRELESS_HISTORY}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  return JSON.parse(value).length;
          master_item:
            key: clients.json
          tags:
            - tag: UniFi Component
              value: Clients
        - uuid: c013d47d65e240e7bf5f682d04ded20d
          name: Devices JSON (Access Points only)
          type: HTTP_AGENT
          key: devices.json
          delay: '{$ITEM_DEVICES.JSON_UPDATE}'
          history: '0'
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.data
            - type: JAVASCRIPT
              parameters:
                - |
                  var site_name = '{$SITE.NAME}';
                  var site_id = '{$SITE.ID}';
                  var obj = JSON.parse(value);
                  var out = [];

                  for (var i = 0; i < obj.length; i++) {
                      var f = obj[i].features || [];
                      if (f.indexOf('accessPoint') === -1) continue;
                      obj[i].site_name = site_name;
                      obj[i].site_id = site_id;
                      out.push(obj[i]);
                  }

                  return JSON.stringify(out);
          url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/integration/v1/sites/{HOST.HOST}/devices
          query_fields:
            - name: limit
              value: '200'
          headers:
            - name: Accept
              value: application/json
            - name: X-API-KEY
              value: '{$UNIFI_NETWORK_API_KEY}'
          tags:
            - tag: UniFi Component
              value: Raw
        - uuid: 95df7af44f2949b99fc2ae8f887b23ba
          name: Access Points Total
          type: DEPENDENT
          key: aps.total
          delay: '0'
          history: '{$ITEM_APS_HISTORY}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  return JSON.parse(value).length;
          master_item:
            key: devices.json
          tags:
            - tag: UniFi Component
              value: Access Points
        - uuid: 66126c878ea1493ea98d534829a38797
          name: Access Points Online
          type: DEPENDENT
          key: aps.online
          delay: '0'
          history: '{$ITEM_APS_HISTORY}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value), n = 0;
                  for (var i = 0; i < a.length; i++) {
                      if (a[i].state === 'ONLINE') n++;
                  }
                  return n;
          master_item:
            key: devices.json
          tags:
            - tag: UniFi Component
              value: Access Points
        - uuid: 18023f82be7545829666be62c1de5ae9
          name: Access Points Offline
          type: DEPENDENT
          key: aps.offline
          delay: '0'
          history: '{$ITEM_APS_HISTORY}'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var a = JSON.parse(value), n = 0;
                  for (var i = 0; i < a.length; i++) {
                      if (a[i].state !== 'ONLINE') n++;
                  }
                  return n;
          master_item:
            key: devices.json
          tags:
            - tag: UniFi Component
              value: Access Points
      macros:
        - macro: '{$ITEM_APS_HISTORY}'
          value: 7d
          description: Items 'aps.*' History
        - macro: '{$ITEM_CLIENTS.JSON_UPDATE}'
          value: 5m
          description: Item 'clients.json' Update Interval
        - macro: '{$ITEM_CLIENTS.WIRELESS_HISTORY}'
          value: 7d
          description: Item 'clients.wireless' History
        - macro: '{$ITEM_DEVICES.JSON_UPDATE}'
          value: 10m
          description: Item 'devices.json' Update Interval
        - macro: '{$SITE.ID}'
          description: Site ID. Used by Template, DO NOT CHANGE OR DELETE.
        - macro: '{$SITE.NAME}'
          description: Site NAME. Used by Template, DO NOT CHANGE OR DELETE.
